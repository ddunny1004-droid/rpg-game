<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECLIPSE SAGA</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04040a;--bg2:#0a0a14;--card:rgba(16,16,32,.92);--panel:#16162c;
  --line:rgba(99,102,241,.22);--line2:rgba(255,255,255,.06);
  --a:#8b5cf6;--a2:#a78bfa;--ag:#ddd6fe;--g:#fbbf24;--g2:#fde68a;
  --t:#f1f1f8;--d:#9b9bb8;--s:#f472b6;--ok:#34d399;--bad:#f87171;--cy:#22d3ee;
  --r:18px;--shadow:0 8px 32px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;}
body{
  font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--t);
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,.25),transparent),
    radial-gradient(ellipse 60% 40% at 100% 50%,rgba(244,114,182,.08),transparent),
    radial-gradient(ellipse 50% 30% at 0% 80%,rgba(34,211,238,.06),transparent),
    linear-gradient(180deg,#06060f 0%,#04040a 100%);
  background-attachment:fixed;
  min-height:100vh;
}
.screen{display:none;min-height:100vh;width:100%}
.screen.on{display:flex;flex-direction:column}

/* TITLE */
#title{align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative;overflow:hidden}
#title::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(139,92,246,.12),transparent 55%);pointer-events:none}
.logo{
  font-family:Cinzel,serif;font-weight:900;font-size:clamp(2.8rem,10vw,5.2rem);
  background:linear-gradient(135deg,#fde68a 0%,#f472b6 30%,#a78bfa 60%,#22d3ee 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.04em;line-height:1.1;position:relative;z-index:1;
  filter:drop-shadow(0 0 40px rgba(167,139,250,.35));
  animation:floaty 5s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sub{font-family:Cinzel,serif;color:var(--ag);letter-spacing:.4em;margin:12px 0 28px;font-size:clamp(.85rem,2vw,1.05rem);position:relative;z-index:1}
.desc{max-width:520px;color:var(--d);line-height:1.85;font-size:1.05rem;margin-bottom:40px;position:relative;z-index:1}
.btn{
  border:none;border-radius:14px;padding:14px 36px;font:700 1rem 'Noto Sans KR',sans-serif;
  cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s;position:relative;z-index:1;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.bp{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 6px 28px rgba(139,92,246,.45)}
.bg{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1a1a;box-shadow:0 6px 24px rgba(251,191,36,.3)}
.bd{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.bh{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--d)}.bh:hover{border-color:var(--a2);color:var(--ag)}
.bs{padding:8px 16px;font-size:.85rem;border-radius:10px}.bl{padding:16px 48px;font-size:1.1rem}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.ver{margin-top:48px;font-size:.75rem;color:var(--d);opacity:.45}

/* CREATE */
#create{align-items:center;padding:32px 20px;overflow-y:auto}
.box{
  background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;
  max-width:720px;width:100%;box-shadow:var(--shadow);backdrop-filter:blur(20px);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ht{font-family:Cinzel,serif;font-size:1.5rem;text-align:center;color:var(--g);margin-bottom:24px}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:.85rem;color:var(--d);margin-bottom:8px;font-weight:500}
.fg input{
  width:100%;padding:14px 16px;background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:12px;color:var(--t);font:inherit;font-size:1rem;transition:border .2s;
}
.fg input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-height:340px;overflow-y:auto;padding:4px}
.cc{
  background:rgba(0,0,0,.3);border:2px solid var(--line2);border-radius:14px;padding:14px 8px;
  text-align:center;cursor:pointer;transition:.18s;
}
.cc:hover{border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.08)}
.cc.sel{border-color:var(--a);background:rgba(139,92,246,.18);box-shadow:0 0 20px rgba(139,92,246,.2)}
.cc .i{font-size:2rem}.cc .n{font-weight:700;font-size:.9rem;margin-top:6px}.cc .d{font-size:.7rem;color:var(--d);margin-top:2px}

/* GAME - wide layout */
#game{max-width:1100px;margin:0 auto;width:100%;min-height:100vh}
.tb{
  background:rgba(10,10,22,.85);border-bottom:1px solid var(--line);padding:14px 20px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(16px);
  position:sticky;top:0;z-index:30;
}
.av{
  width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--a),#4c1d95);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;
  box-shadow:0 4px 16px rgba(139,92,246,.35);
}
.av.sec{background:linear-gradient(145deg,#f472b6,#9d174d)}
.pi{flex:1;min-width:140px}
.pn{font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
.pc{font-size:.8rem;color:var(--d);margin-top:2px}
.bars{flex:1.6;min-width:180px;display:flex;flex-direction:column;gap:5px}
.br{display:flex;align-items:center;gap:8px}
.blb{font-size:.65rem;width:24px;color:var(--d);font-weight:800;letter-spacing:.02em}
.bt{flex:1;height:9px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
.bf{height:100%;border-radius:5px;transition:width .35s ease}
.bf.hp{background:linear-gradient(90deg,#dc2626,#f87171)}
.bf.mp{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.bf.xp{background:linear-gradient(90deg,#059669,#34d399)}
.btx{font-size:.68rem;color:var(--d);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.tr{display:flex;gap:10px;align-items:center}
.lv{background:linear-gradient(135deg,var(--a),#5b21b6);padding:6px 14px;border-radius:10px;font-size:.85rem;font-weight:800;box-shadow:0 2px 12px rgba(139,92,246,.3)}
.gd{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);padding:6px 14px;border-radius:12px;font-size:.9rem;font-weight:800;color:var(--g)}

.main{padding:20px 20px 100px;display:flex;flex-direction:column;gap:16px;flex:1}
@media(min-width:800px){
  .main{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto 1fr;gap:18px;padding:24px 28px 110px}
  .zone{grid-column:1;grid-row:1}
  .acts{grid-column:1;grid-row:2;align-content:start}
  .log{grid-column:2;grid-row:1/3;max-height:none;min-height:360px}
}

.zone{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;
  text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.zone::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(139,92,246,.12),transparent 60%);pointer-events:none}
.zi{font-size:3.2rem;margin-bottom:8px;position:relative;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.zn{font-family:Cinzel,serif;font-size:1.45rem;color:var(--g2);position:relative;z-index:1}
.zd{font-size:.9rem;color:var(--d);margin-top:8px;position:relative;z-index:1}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ab{
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px 12px;
  cursor:pointer;text-align:center;color:var(--t);font:inherit;transition:.18s;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.ab:hover{border-color:var(--a);background:rgba(139,92,246,.12);transform:translateY(-2px);box-shadow:0 6px 20px rgba(139,92,246,.15)}
.ab .ai{font-size:1.7rem;display:block;margin-bottom:6px}.ab .at{font-weight:800;font-size:.95rem;display:block}.ab .ad{font-size:.72rem;color:var(--d);margin-top:3px;display:block}

.log{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  max-height:220px;overflow-y:auto;font-size:.88rem;line-height:1.65;box-shadow:var(--shadow);
}
.le{margin-bottom:4px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.sys{color:var(--ag)}.cmb{color:var(--bad)}.lt{color:var(--g)}.hl{color:var(--ok)}.st{color:#c4b5fd}.sc{color:var(--s)}.qt{color:var(--cy)}

.nav{
  display:flex;justify-content:center;gap:8px;background:rgba(8,8,18,.92);border-top:1px solid var(--line);
  padding:12px 16px;position:fixed;bottom:0;left:0;right:0;z-index:30;backdrop-filter:blur(16px);
}
.nb{
  background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:12px;color:var(--d);
  font:600 .72rem 'Noto Sans KR';cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 18px;min-width:72px;transition:.15s;
}
.nb:hover{color:var(--ag);border-color:var(--a);background:rgba(139,92,246,.1)}
.nb span{font-size:1.35rem}

/* COMBAT */
.cm{display:none;padding:20px 20px 100px;flex-direction:column;gap:14px}
.cm.on{display:flex}
@media(min-width:800px){.cm{padding:28px 28px 110px;max-width:900px;margin:0 auto;width:100%}}
.arena{
  display:flex;justify-content:space-around;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px 16px;
  min-height:200px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.arena::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(139,92,246,.08),transparent 40%),radial-gradient(ellipse at 70% 50%,rgba(248,113,113,.08),transparent 40%);pointer-events:none}
.cu{text-align:center;position:relative;z-index:1;min-width:120px}
.cu.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.us{font-size:3.6rem;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));margin-bottom:4px}
.un{font-weight:800;font-size:1rem}
.uh{width:110px;height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;margin:8px auto 4px;border:1px solid rgba(255,255,255,.06)}
.uf{height:100%;background:linear-gradient(90deg,#dc2626,#f87171);transition:width .3s;border-radius:5px}
.ut{font-size:.75rem;color:var(--d)}
.vs{font-family:Cinzel,serif;font-weight:900;font-size:1.6rem;color:var(--bad);text-shadow:0 0 20px rgba(248,113,113,.4);position:relative;z-index:1}
.sks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sk{
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;
  text-align:left;cursor:pointer;color:var(--t);font:inherit;transition:.15s;
}
.sk:hover:not(:disabled){border-color:var(--a);background:rgba(139,92,246,.12);transform:translateY(-1px)}
.sk:disabled{opacity:.35;cursor:not-allowed}
.skn{font-weight:800;font-size:.92rem}.skc{font-size:.72rem;color:#60a5fa;margin-top:2px}.skd{font-size:.72rem;color:var(--d);margin-top:2px}
.clog{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;
  max-height:140px;overflow-y:auto;font-size:.85rem;line-height:1.55;
}

/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.mo.on{display:flex}
.md{
  background:linear-gradient(160deg,rgba(20,20,40,.98),rgba(12,12,24,.98));
  border:1px solid var(--line);border-radius:22px;padding:28px;max-width:480px;width:100%;
  max-height:88vh;overflow-y:auto;animation:fadeUp .3s;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.mt{font-family:Cinzel,serif;font-size:1.3rem;color:var(--g);text-align:center;margin-bottom:18px}
.ir{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;margin-bottom:8px}
.ii{font-size:1.5rem}.if{flex:1}.inm{font-weight:800;font-size:.95rem}.idc{font-size:.78rem;color:var(--d);margin-top:2px}
.iq{font-size:.85rem;color:var(--g);font-weight:800}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.scd{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;padding:14px;text-align:center}
.sv{font-size:1.3rem;font-weight:900;color:var(--ag)}.sl{font-size:.72rem;color:var(--d);margin-top:2px}
.qi{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:8px}
.qi.on{border-color:var(--a)}.qi.dn{border-color:var(--ok);opacity:.75}
.qt2{font-weight:800;font-size:.95rem}.qd{font-size:.8rem;color:var(--d);margin-top:4px}.qp{font-size:.78rem;color:var(--g);margin-top:4px}
.nd{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:14px;line-height:1.7;font-size:.95rem}
.nn{color:var(--g);font-weight:800;margin-bottom:8px}

.toast{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.to{background:rgba(20,20,40,.95);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:.88rem;max-width:280px;animation:fadeUp .25s;box-shadow:var(--shadow);pointer-events:auto}
.to.lt{border-color:rgba(251,191,36,.5)}.to.lv{border-color:rgba(139,92,246,.5)}.to.sc{border-color:rgba(244,114,182,.5)}.to.qt{border-color:rgba(34,211,238,.5)}

#end{align-items:center;justify-content:center;text-align:center;padding:40px}
.et{font-family:Cinzel,serif;font-size:clamp(1.8rem,5vw,2.6rem);background:linear-gradient(135deg,#fde68a,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
.ex{max-width:480px;line-height:1.9;color:var(--d);margin-bottom:36px;font-size:1.05rem}

#err{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#f33;text-align:center;padding:24px}
#err.on{display:flex}.er{font-size:2rem;margin-bottom:14px;animation:glitch .3s infinite}
#celeb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;align-items:center;justify-content:center;padding:20px}
#celeb.on{display:flex}
.cb{background:var(--card);border:2px solid #ef4444;border-radius:20px;padding:36px 28px;max-width:360px;text-align:center;animation:pulse 1.5s infinite}
.cb h2{color:#ef4444;margin-bottom:12px;font-size:1.4rem}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 28px 10px rgba(239,68,68,.2)}}
#glitch{display:none;position:fixed;inset:0;z-index:8000;background:#000;color:#0f0;font-family:monospace;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#glitch.on{display:flex;animation:glitch .18s infinite}
#glitch .gmsg{font-size:clamp(1.2rem,4vw,1.8rem);margin:10px 0;text-shadow:3px 0 #f0f,-3px 0 #0ff}
@keyframes glitch{0%{transform:none;filter:none}20%{transform:translate(-4px,1px);filter:hue-rotate(90deg)}40%{transform:translate(4px,-2px);filter:hue-rotate(180deg)}60%{transform:translate(-3px,2px);filter:invert(.15)}100%{transform:none}}
#cut{display:none;position:fixed;inset:0;z-index:8100;background:#000;color:var(--t);flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center}
#cut.on{display:flex;animation:fadeUp 1.2s}
#cut .cl{font-family:Cinzel,serif;font-size:clamp(1.4rem,4vw,2rem);color:var(--g);margin-bottom:24px}
#cut .ct{max-width:440px;line-height:2;color:var(--d);font-size:1.05rem;margin-bottom:36px}
/* PREMIUM HIDDEN-JOB CUTSCENE / SKILL FX */

/* DISTINCT JOB/SKILL FX PACK */
.fx-orbit{position:fixed;left:50%;top:45%;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,var(--fx1) 28%,transparent 72%);box-shadow:0 0 24px var(--fx1),0 0 70px var(--fx2);animation:fxOrbit .75s ease-out forwards;z-index:9000;pointer-events:none}
@keyframes fxOrbit{0%{transform:translate(-50%,-50%) scale(.1);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(10) rotate(540deg);opacity:0}}
.fx-beam{position:fixed;left:50%;top:50%;width:4px;height:8vh;background:linear-gradient(#fff,var(--fx1),transparent);box-shadow:0 0 18px var(--fx1),0 0 55px var(--fx2);transform-origin:center bottom;animation:fxBeam .55s ease-out forwards;z-index:9000;pointer-events:none}
@keyframes fxBeam{0%{transform:translate(-50%,-100%) scaleY(.1) rotate(var(--rot));opacity:0}25%{opacity:1}100%{transform:translate(-50%,-100%) scaleY(13) rotate(var(--rot));opacity:0}}
.fx-shock{position:fixed;left:50%;top:48%;width:20px;height:20px;border:3px solid var(--fx1);border-radius:50%;box-shadow:0 0 20px var(--fx1);animation:fxShock .6s ease-out forwards;z-index:9000;pointer-events:none}
@keyframes fxShock{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}100%{transform:translate(-50%,-50%) scale(16);opacity:0;border-width:1px}}
.fx-spark{position:fixed;left:50%;top:45%;font-size:2rem;filter:drop-shadow(0 0 12px var(--fx1));animation:fxSpark .72s cubic-bezier(.15,.8,.2,1) forwards;z-index:9000;pointer-events:none}
@keyframes fxSpark{0%{transform:translate(-50%,-50%) scale(.1) rotate(0);opacity:0}18%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--sc)) rotate(var(--rot));opacity:0}}
.fx-scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.08) 6px 7px);mix-blend-mode:screen;animation:fxScan .55s linear forwards;z-index:8999;pointer-events:none}
@keyframes fxScan{0%{opacity:0;transform:translateY(-20%)}20%{opacity:1}100%{opacity:0;transform:translateY(20%)}}
.fx-pixel{position:fixed;left:50%;top:45%;width:18px;height:18px;background:var(--fx1);box-shadow:18px 0 var(--fx2),-18px 0 var(--fx2),0 18px var(--fx1),0 -18px var(--fx2),0 0 25px var(--fx1);animation:fxPixel .5s steps(5,end) forwards;z-index:9000;pointer-events:none}
@keyframes fxPixel{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(8) rotate(90deg);opacity:0}}
.fx-glitch{position:fixed;left:50%;top:45%;font-family:monospace;font-size:2.4rem;font-weight:900;color:var(--fx1);text-shadow:4px 0 var(--fx2),-4px 0 #fff;animation:fxGlitch .5s steps(2,end) forwards;z-index:9000;pointer-events:none}
@keyframes fxGlitch{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{opacity:1;transform:translate(calc(-50% + 8px),-50%)}50%{transform:translate(calc(-50% - 8px),-50%) skewX(12deg)}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
.fx-spiral{position:fixed;left:50%;top:46%;width:18px;height:18px;border:3px solid var(--fx1);border-left-color:transparent;border-radius:50%;box-shadow:0 0 20px var(--fx2);animation:fxSpiral .8s ease-out forwards;z-index:9000;pointer-events:none}
@keyframes fxSpiral{0%{transform:translate(-50%,-50%) scale(.1) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(18) rotate(1440deg);opacity:0}}
.fx-flame{position:fixed;left:50%;top:48%;font-size:3rem;filter:drop-shadow(0 0 18px var(--fx1));animation:fxFlame .65s ease-out forwards;z-index:9000;pointer-events:none}

function doWepEnh(){
  if(!S.wep||!WEP[S.wep]){toast('무기 없음');return}
  const lv=S.wepEnh||0;
  if(lv>=30){toast('최대 강화 (+30)');return}
  const cost=Math.max(20,Math.floor((80+lv*lv*45+lv*60)/3));
  if(S.gold<cost){toast('골드 부족');return}
  S.gold-=cost;
  const rate=Math.max(25,Math.min(92,78-lv*2));
  if(Math.random()*100<rate){
    S.wepEnh=lv+1;
    log('🔨 무기 강화 성공! '+WEP[S.wep].n+' +'+S.wepEnh,'lt');
    toast('🔨 성공! +'+S.wepEnh,'lv');
  }else{
    log('💢 무기 강화 실패… (+'+lv+' 유지)','cmb');
    toast('💢 강화 실패');
  }

}

function jobHall(){
  const c=C[S.cls],line=c.line,tier=(S.tier!=null&&S.tier!=='')?Number(S.tier):(c.tier||0);
  let h='<div class="mt">🏛️ 전직관</div><p style="text-align:center;color:var(--d);font-size:.82rem;margin-bottom:12px">현재: <b>'+c.n+'</b> (전직 단계 '+tier+')</p>';
  const need=[0,5,30,60];
  if(tier>=3){h+='<p style="text-align:center;color:var(--ok)">최종 전직 완료</p>'}
  else{
    const nextT=tier+1,req=need[nextT];
    if(S.lv<req)h+='<p style="text-align:center;color:var(--bad)">다음 전직: Lv.'+req+' 필요 (현재 '+S.lv+')</p>';
    else{
      const opts=(PROMO[line]&&PROMO[line][nextT])||[];
      if(!opts.length)h+='<p style="text-align:center;color:var(--d)">전직 경로 없음</p>';
      else opts.forEach(k=>{const tc=C[k];if(!tc)return;h+='<div class="ir"><div class="ii">'+tc.i+'</div><div class="if"><div class="inm">'+tc.n+'</div><div class="idc">'+(nextT)+'차 전직 · 스킬 교체</div></div><button class="btn bp bs" onclick="doPromo(\''+k+'\','+nextT+')">전직</button></div>'});
    }
  }
  h+='<button class="btn bh" style="width:100%;margin-top:10px" onclick="closeM()">닫기</button>';openM(h)
}
function doPromo(k,t){const tc=C[k];if(!tc){toast('전직 데이터 오류');return}
if(tc.hid){closeM();pendingHiddenClass=k;pendingHiddenTier=Number(t);runHiddenCut(k,S.name,{promote:true});return}
S.cls=k;S.tier=Number(t);S.wep=JOB_WEAPON[k]||S.wep;S.wepEnh=0;
S.mhp=Math.max(S.mhp,tc.hp+S.lv*4);S.mmp=Math.max(S.mmp,tc.mp+S.lv*3);S.hp=S.mhp;S.mp=S.mmp;
S.atk=Math.max(S.atk,tc.atk+Math.floor(S.lv*1.0));S.matk=Math.max(S.matk,tc.matk+Math.floor(S.lv*1.0));S.def=Math.max(S.def,tc.def+Math.floor(S.lv*0.5));
if(tc.spd)S.spd=Math.max(S.spd,tc.spd);if(tc.crit)S.crit=Math.max(S.crit,tc.crit);
const skn=(tc.sk||[]).map(x=>x.n).join(', ');
log('🏛️ 전직! → '+tc.n+' | 스킬: '+skn,'st');toast('🏛️ '+tc.n,'lv');ui();softSave();closeM();jobHall()}

function addFriend(){
  if(!S.tag){toast('먼저 # 태그를 설정하세요');showTagSetup();return}
  const inp=document.getElementById('friendIn');
  const raw=(inp&&inp.value||'').trim();
  const p=parseFriendId(raw);
  if(!p){toast('형식: 닉네임#0000');return}
  if(p.id===myId()){toast('자기 자신은 불가');return}
  if(!idExists(p.id)){toast('존재하지 않는 닉/태그입니다');log('❌ 없는 ID: '+p.id,'sys');return}
  if((S.friends||[]).some(f=>(f.id||f)===p.id)){toast('이미 친구');return}
  if(!S.pendingOut)S.pendingOut=[];
  if(S.pendingOut.some(x=>x.id===p.id)){toast('이미 요청함');return}
  sendFriendReq(p.id,myId(),S.name);
  S.pendingOut.push({id:p.id,name:p.name,ts:Date.now()});
  softSave();
  toast('📩 '+p.id+' 에게 요청 전송');
  log('📩 친구 요청 → '+p.id,'sys');
  friendsUI();
}
function acceptFriend(i){
  const r=S.pendingIn[i];if(!r)return;
  if(!S.friends)S.friends=[];
  S.friends.push({id:r.from,name:r.name||r.from.split('#')[0]});
  S.pendingIn.splice(i,1);
  // notify reverse mailbox so requester can auto-accept
  const box=getMailbox();
  const key='accept:'+r.from;
  if(!box[key])box[key]=[];
  box[key].push({from:myId(),name:S.name,ts:Date.now()});
  setMailbox(box);
  softSave();toast('✅ 친구 수락');friendConfirmUI();
}
function rejectFriend(i){S.pendingIn.splice(i,1);softSave();toast('거절됨');friendConfirmUI()}
function delFriend(i){S.friends.splice(i,1);softSave();friendsUI()}
function syncAccepts(){
  if(!S.tag)return;
  const box=getMailbox();
  const key='accept:'+myId();
  const list=box[key]||[];
  if(!S.friends)S.friends=[];
  list.forEach(r=>{
    if(!S.friends.some(f=>(f.id||f)===r.from))S.friends.push({id:r.from,name:r.name||r.from.split('#')[0]});
    if(S.pendingOut)S.pendingOut=S.pendingOut.filter(p=>p.id!==r.from);
  });
  if(box[key]){delete box[key];setMailbox(box)}
}

function cutFxSound(kind='slash'){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.type=kind==='magic'?'sine':kind==='impact'?'square':'sawtooth';o.frequency.setValueAtTime(kind==='magic'?520:180,now);o.frequency.exponentialRampToValueAtTime(kind==='magic'?90:55,now+.16);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.2);o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+.22);setTimeout(()=>ac.close().catch(()=>{}),300)}catch(e){}
}

  const col=(hidden?palettes[line]:normal)||normal.w, symbol=c.i||'✦';
  const styleSets={
    blade:['fx-slash2','fx-spark','fx-shock','fx-line'], magic:['fx-orbit','fx-beam','fx-spiral','fx-shock'],
    nature:['fx-spark','fx-orbit','fx-ring','fx-line'], machine:['fx-scan','fx-beam','fx-shock','fx-glitch'],
    void:['fx-spiral','fx-orbit','fx-glitch','fx-shock'], fun:['fx-spark','fx-pixel','fx-orbit','fx-shock'], heal:['fx-orbit','fx-spark','fx-ring','fx-flame']
  };
  let family=(sk.t==='h')?'heal':(['m','d','bug','jw'].includes(sk.t)?'magic':(line==='px'?'fun':(line==='fk'||line==='ms'?'machine':(line==='vd'?'void':(line==='bb'||line==='hw'?'nature':'blade')))));
  const styles=styleSets[family];

  const add=(cls,txt='',delay=0)=>{setTimeout(()=>{const e=document.createElement('div');e.className=cls;e.style.setProperty('--fx1',col[0]);e.style.setProperty('--fx2',col[1]);if(cls==='fx-spark'){e.textContent=txt||symbol;e.style.setProperty('--dx',(Math.random()*70-35)+'vw');e.style.setProperty('--dy',(Math.random()*55-27)+'vh');e.style.setProperty('--sc',(1.2+Math.random()*2.2).toFixed(2));e.style.setProperty('--rot',(Math.random()*720-360)+'deg')}if(cls==='fx-beam')e.style.setProperty('--rot',((seed%140)-70)+'deg');if(cls==='fx-line'||cls==='fx-slash2')e.style.setProperty('--a',((seed+idx*47)%140-70)+'deg');root.appendChild(e)},delay)};
  add(chosen, symbol, 0);
  if(sk.t==='h'){add('fx-spark','✨',80);add('fx-orbit','',170)}

function pturn(sk){if(busy||!inC||S.mp<sk.c)return;busy=1;skillFx(sk);S.mp-=sk.c;document.getElementById('pu').classList.add('hit');setTimeout(()=>document.getElementById('pu').classList.remove('hit'),280);
const st=(sk.t==='m'||sk.t==='d'||sk.t==='eat'||sk.t==='bug'||sk.t==='jw')?totalMatk():totalAtk();
const base=Math.floor(st*sk.p*(.9+Math.random()*.2)*(S._partyBonus||1));const crit=sk.id==='u'||Math.random()*100<S.crit;
if(sk.t==='h'){const h=Math.floor(S.mhp*sk.p+totalMatk()*.4);S.hp=Math.min(S.mhp,S.hp+h);log('💚 '+sk.n+' HP+'+h,'hl','clog')}
else if(sk.t==='b'){guard=1;log('🛡️ '+sk.n,'sys','clog')}
else if(sk.t==='x'){const hits=(S.cls==='hwarang'?5:3);for(let i=0;i<hits;i++){let hit=Math.max(1,Math.floor(base*(.85+Math.random()*.3))-curE.def);if(crit)hit=Math.floor(hit*1.5);curE.hp-=hit;log('⚡ '+sk.n+' ('+(i+1)+'/'+hits+') '+hit+(crit?' 💥':''),'cmb','clog')}}
else if(sk.t==='o'){const d=Math.max(1,base-curE.def);curE.hp-=d;poison=3;log('☠️ '+sk.n+' '+d,'cmb','clog')}
else if(sk.t==='d'){let d=Math.max(1,base-Math.floor(curE.def*.5));if(crit)d=Math.floor(d*1.5);curE.hp-=d;const ab=Math.floor(d*.4);S.hp=Math.min(S.mhp,S.hp+ab);log('🩸 '+sk.n+' '+d+'(흡+'+ab+')','cmb','clog')}
else if(sk.t==='bot'){if(S.robotDead)log('🤖 로봇 재소환 불가','sys','clog');else if(S.robot&&S.robot.hp>0)log('🤖 이미 소환됨','sys','clog');else{S.robot={hp:50,mhp:50,atk:12,battles:0};log('🤖 코딱지 로봇 조립!','sys','clog');toast('🤖 로봇')}}
else if(sk.t==='eat'){let d=Math.max(1,Math.floor(base*1.1)-curE.def);if(crit)d=Math.floor(d*1.5);curE.hp-=d;log('🍖 다처먹기 '+d,'cmb','clog');if(Math.random()<0.05){stomach=99;log('🤢 배탈!','sys','clog')}}
else if(sk.t==='gf'){if(gfUsed)log('👩 이미 소환함','sys','clog');else{gfUsed=1;var total=Math.floor(67*(gfDmg||1));curE.hp-=total;log('👩 여친67 총 '+total,'cmb','clog')}}
else if(sk.t==='train'){gfDmg=(gfDmg||1)+0.5;log('📈 여친 데미지 → '+gfDmg,'sys','clog')}
else if(sk.t==='bug'){let d=Math.max(1,Math.floor(base*(1+Math.random()*.5))-curE.def);if(Math.random()<.2){d*=2;log('🐛 버그폭발 '+d,'cmb','clog');curE.hp-=d}else if(Math.random()<.12){S.hp=Math.max(1,S.hp-Math.floor(d*.25));curE.hp-=d;log('🐛 버그 역류 '+d,'cmb','clog')}else{curE.hp-=d;log('🐛 버그쓰기 '+d,'cmb','clog')}}
else if(sk.t==='freeze'){freeze=1;log('🧊 상대 정지!','sys','clog');toast('🧊 정지')}
else if(sk.t==='jw'){let d=Math.max(1,Math.floor(totalMatk()*sk.p*1.2)+50);curE.hp-=d;log('🍜 마라탕 정우 소환! '+d,'cmb','clog')}
else{if(sk.id==='r'&&S.cls==='berserker')S.hp=Math.max(1,S.hp-Math.floor(S.mhp*.08));let d=Math.max(1,base-curE.def+(S.ba||0));if(crit)d=Math.floor(d*1.6);curE.hp-=d;log('⚔️ '+sk.n+' '+d+(crit?' 💥':''),'cmb','clog')}
cbars();if(curE.hp<=0){setTimeout(()=>endC(1),500);return}setTimeout(()=>eturn(),550)}
function eturn(){if(!inC||curE.hp<=0)return;
if(freeze>0){freeze=0;log('🧊 적 턴 스킵','sys','clog');busy=0;rsk();return}
if(stomach>0){const sd=Math.max(1,Math.floor(S.mhp*.04));S.hp=Math.max(1,S.hp-sd);log('🤢 배탈 -'+sd,'cmb','clog');cbars()}
if(poison>0){const pd=Math.floor(curE.mhp*.08);curE.hp-=pd;poison--;log('☠️ 독 '+pd,'cmb','clog');cbars();if(curE.hp<=0){setTimeout(()=>endC(1),400);return}}

document.getElementById('eu').classList.add('hit');setTimeout(()=>document.getElementById('eu').classList.remove('hit'),280);

if(curE.k==='dragon'&&Math.random()>.5){dmg=Math.floor(dmg*1.7);log('💢 화염숨결! '+dmg,'cmb','clog')}else log('💢 '+curE.n+' '+dmg,'cmb','clog');

S.hp=Math.max(0,S.hp-dmg);cbars();
if(S.hp<=0){if(S.ph||(S.inv.phoenix>0)){S.hp=Math.floor(S.mhp*.4);S.ph=0;if(S.inv.phoenix){S.inv.phoenix--;if(!S.inv.phoenix)delete S.inv.phoenix}log('🪶 부활!','hl','clog');toast('🪶');cbars();busy=0;rsk();return}
setTimeout(()=>endC(0),500);return}busy=0;rsk()}

if(won){S.xp+=curE.xp;S.gold+=curE.g;S.kills++;if(S.zone==='forest'){S.fk++;S.fw++;tq('kf');tq('fw')}if(S.zone==='cave'||S.zone==='ruins'){S.dk++;tq('kd')}if(curE.k==='dragon')tq('boss');
log('🎉 승리! EXP+'+curE.xp+' 💰+'+curE.g,'lt');toast('🎉 +'+curE.xp+'EXP','lt');

lvup();if(curE.k==='dragon'){S.flags.dragon=1;log('🐉 이클립스 드래곤 토벌! 모험은 계속된다…','st');toast('🐉 토벌 완료 — 계속 플레이','lv');}}

function sceneTone(line,tier=0){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),g=ac.createGain(),o=ac.createOscillator(),n=ac.currentTime;const map={hw:440,gk:330,dl:110,cg:660,bb:220,sn:520,fk:90,gl:180,ms:260,bl:150,vd:70,px:780,gt:392};o.type=(line==='ms'||line==='px')?'square':(line==='fk'||line==='gl'?'sawtooth':'sine');o.frequency.setValueAtTime((map[line]||300)*(1+tier*.08),n);o.frequency.exponentialRampToValueAtTime((map[line]||300)*1.8,n+.35);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.045,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+.55);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.6);setTimeout(()=>ac.close().catch(()=>{}),800)}catch(e){}}

function enter(){show('game');if(S){S.xn=xpNeed(S.lv||1);if(!S.wep)S.wep=JOB_WEAPON[S.cls]||null}playOst();ui();renderActs();document.getElementById('glog').innerHTML='';
if(!S.flags.intro){log('✨ '+S.name+', 별빛 마을에 도착했다','st');S.flags.intro=1;softSave()}
else log('📍 '+Z[S.zone].n,'sys');
if(!S.tutDone)setTimeout(showTutorial,400);
else if(!S.tag)setTimeout(showTagSetup,400);
else{registerMe();pullFriendReqs();syncAccepts();}
}

const TUTORIAL_STEPS=[
  {t:'🌟 별빛 마을',d:'모험의 시작입니다. 마을에서는 상점·여관·전직관 같은 시설을 이용할 수 있습니다.'},

  {t:'👥 친구와 파티',d:'친구를 추가하면 파티 사냥과 레이드 같은 콘텐츠를 이용할 수 있습니다.'},
  {t:'💾 저장과 조사',d:'하단 저장 버튼으로 슬롯을 저장할 수 있고, 조사는 하루 50회까지 가능합니다.'},
  {t:'👑 계속되는 모험',d:'보스를 잡아도 모험은 끝나지 않습니다. 전직과 히든 직업을 찾아 더 강해져 보세요.'}
];
function showTutorial(){
  _tutStep=0;
  renderTutorialStep();
}
function renderTutorialStep(){
  const s=TUTORIAL_STEPS[_tutStep];
  const last=_tutStep===TUTORIAL_STEPS.length-1;
  let h='<div class="mt">📖 튜토리얼</div>';
  h+='<div style="text-align:center;color:var(--d);font-size:.78rem;margin:-4px 0 12px">'+(_tutStep+1)+' / '+TUTORIAL_STEPS.length+'</div>';
  h+='<div class="nd" style="min-height:150px">';
  h+='<div style="font-size:1.15rem;font-weight:900;text-align:center;margin-bottom:12px">'+s.t+'</div>';
  h+='<div style="line-height:1.8;text-align:center">'+s.d+'</div></div>';
  h+='<div style="display:flex;gap:8px;margin-top:10px">';
  if(_tutStep>0) h+='<button class="btn bh" style="flex:1" onclick="tutorialPrev()">← 이전</button>';
  h+='<button class="btn bp" style="flex:1" onclick="tutorialNext()">'+(last?'🎁 튜토리얼 완료':'다음 →')+'</button></div>';
  h+='<button class="btn bh" style="width:100%;margin-top:8px;opacity:.8" onclick="skipTut()">튜토리얼 건너뛰기 (보상 없음)</button>';
  openM(h);
}
function tutorialNext(){
  if(_tutStep<TUTORIAL_STEPS.length-1){_tutStep++;renderTutorialStep();return;}
  finishTut();
}
function tutorialPrev(){if(_tutStep>0){_tutStep--;renderTutorialStep()}}
function skipTut(){if(confirm('튜토리얼을 건너뛰면 이번 튜토리얼 보상을 받을 수 없습니다. 건너뛸까요?'))finishTut(false)}
function finishTut(reward=true){
  const earned=reward!==false && _tutStep===TUTORIAL_STEPS.length-1;
  S.tutDone=1;closeM();
  if(earned){S.gold+=200;S.inv.potion=(S.inv.potion||0)+3;S.inv.ether=(S.inv.ether||0)+2;log('📖 튜토리얼 완료! 골드+200, 포션+3','lt');toast('🎁 튜토리얼 보상','lt')}
  else{log('📖 튜토리얼 스킵 (보상 없음)','sys');toast('스킵됨')}
  softSave();ui();
  setTimeout(showTagSetup,300);
}

function showTagSetup(){
  if(S.tag)return;
  let h='<div class="mt"># 태그 설정</div>';
  h+='<p style="text-align:center;color:var(--d);font-size:.85rem;margin-bottom:12px">친구 추가용 코드입니다.<br>내 ID: <b style="color:var(--g)">'+S.name+'#????</b><br>숫자 <b>최대 4자리</b>를 정하세요.</p>';
  h+='<div class="fg"><input id="tagIn" placeholder="예: 0001" maxlength="4" inputmode="numeric" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#000;color:#fff;text-align:center;font-size:1.2rem;letter-spacing:.2em"></div>';
  h+='<button class="btn bp" style="width:100%;margin-top:10px" onclick="setTag()">확정</button>';
  openM(h);
  setTimeout(()=>{const el=document.getElementById('tagIn');if(el)el.focus()},100);
}
function setTag(){
  const el=document.getElementById('tagIn');
  let t=(el&&el.value||'').trim().replace(/\D/g,'');
  if(!t||t.length<1||t.length>4){toast('1~4자리 숫자만');return}
  t=t.padStart(4,'0').slice(-4);
  S.tag=t;registerMe();softSave();closeM();
  log('🆔 내 ID: '+S.name+'#'+S.tag,'st');
  toast('🆔 '+S.name+'#'+S.tag,'lv');
  ui();
}

function getRegistry(){try{return JSON.parse(lsG('eclipse_registry')||'{}')}catch(e){return{}}}
function setRegistry(o){lsS('eclipse_registry',JSON.stringify(o))}
function registerMe(){
  if(!S||!S.tag)return;
  const o=getRegistry();
  o[myId()]={name:S.name,tag:S.tag,cls:S.cls,lv:S.lv,ts:Date.now()};
  setRegistry(o);
}
function idExists(fid){
  const o=getRegistry();
  if(o[fid])return true;
  // also check all save slots
  const slots=saveSlots();
  for(let i=1;i<=10;i++){
    const d=slots[i];
    if(!d||!d.data)continue;
    const id=(d.data.name||d.name)+'#'+(d.data.tag||d.tag||'');
    if(id===fid)return true;
  }
  return false;
}

function myId(){return S.name+'#'+(S.tag||'????')}
function parseFriendId(str){
  str=(str||'').trim();
  const m=str.match(/^(.+)#(\d{1,4})$/);
  if(!m)return null;
  return{name:m[1].trim(),tag:m[2].padStart(4,'0').slice(-4),id:m[1].trim()+'#'+m[2].padStart(4,'0').slice(-4)};
}
function getMailbox(){try{return JSON.parse(lsG('eclipse_mailbox')||'{}')}catch(e){return{}}}
function setMailbox(o){lsS('eclipse_mailbox',JSON.stringify(o))}
function sendFriendReq(targetId,fromId,fromName){
  const box=getMailbox();
  if(!box[targetId])box[targetId]=[];
  if(box[targetId].some(x=>x.from===fromId))return false;
  box[targetId].push({from:fromId,name:fromName,ts:Date.now()});
  setMailbox(box);return true;
}
function pullFriendReqs(){
  if(!S.tag)return;
  const id=myId();
  const box=getMailbox();
  const list=box[id]||[];
  if(!S.pendingIn)S.pendingIn=[];
  list.forEach(r=>{
    if(!S.pendingIn.some(x=>x.from===r.from)&&!(S.friends||[]).some(f=>f.id===r.from)){
      S.pendingIn.push(r);
    }
  });
  if(box[id]){delete box[id];setMailbox(box)}
}

if(hasAnySave())document.getElementById('contBtn').style.display='inline-flex';
document.getElementById('mo').addEventListener('click',e=>{if(e.target===e.currentTarget)closeM()});
</script></body></html>
